<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quibbles - Nigeria's Leading Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script>
        tailwind.config = {
            context: ["./**/*.{html,js}"],
            theme: { 
                extend: {
                    fontFamily: {sans: ['Inter', 'system-ui', 'sans-serid'] }
                } 
            }
        }
    </script>
    <style>
        .post-card {transition: all 0.2s;}
        .post-card:hover {transform : translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- NAVBAR (MY PART) -->
     <nav class = "bg-white border-b sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4">
            <div class="h-14 flex items-center justify-between">

                <!--Logo -->
                <div class="flex items-center gap-3">
                <img src="https://quibblesapp.com/img/Quibbles_Logo.png" alt="Quibbles Logo" class="h-8">
                </div>

                <!-- Search Bar -->
                 <div class="flex-1 max-w-xl mc-8">
                    <div class="relative">
                        <input type="text" id="searchInput"
                        class="w-full bg-gray-100 border border-gray-300 rounded-full py-2.5 pl-11 pr-4 text-sm focus:outline-none focus:border-blue-500"
                        placeholder="Search communities, posts, or people...">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-gray-400"></i>
                    </div>
                 </div>

                <!-- Right Side -->
                <div class="flex items-center gap-4">
                    <button class="px-5 py-1.5 border border-blue-600 text-blue-600 hover:bg-blue-50 rounded-full text-sm font-medium">
                        Log in
                    </button>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-1.5 rounded-full text-sm font-medium">
                        Sign Up
                    </button>
                </div>
            </div>
        </div>    
     </nav>

     <div class="max-w-7xl mx-auto flex gap-6 px-4 py-6">

        <!-- LEFT SIDEBAR (MY PART) -->
         <aside class="w-64 hidden lg:block space-y-6">
            <!-- Navigation -->
            <div class="bg-white rounded-2xl p-4">
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-100 rounded-xl mt-1 rounded-xl font-medium">
                    <i class="fa-solid fa-house w-5"></i>
                    <span>Home</span>
                </a>

                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-100 rounded-xl mt-1 rounded-xl font-medium">
                    <i class="fa-solid fa-clock w-5"></i>
                    <span>Latest</span>
                </a>

                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-100 rounded-xl mt-1">
                    <i class="fa-solid fa-fire w-5"></i>
                    <span>Trending</span>
                </a>

                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-100 rounded-xl mt-1 rounded-xl font-medium">
                    <i class="fa-solid fa-comment w-5"></i>
                    <span>Chat</span>
                </a>
            </div>

            <!-- Communities -->
            <div class="bg-white rounded-2xl p-4">
                <div class="flex justify-between items-center mb-4 px-2">
                    <h3 class="font-semibold">Communities</h3>
                    <button class="text-blue-600 text-sm font-medium">Create +</button>
                </div>

            <div class="space-y-1 max-h-96 overflow-y-auto">
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-100 rounded-xl">
                    <img src="https://api.dicebear.com/9.x/icons/svg?seed=Jamb.png" class="w-6 h-6 rounded-full">
                    <span class="font-medium text-sm">q/Jamb</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-100 rounded-xl">
                    <img src="https://api.dicebear.com/9.x/icons/svg?seed=FCBarcelona.png" class="w-6 h-6 rounded-full">
                    <span class="font-medium text-sm">q/FCBarcelona</span>
                </a>
                  <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-100 rounded-xl">
                    <img src="https://api.dicebear.com/9.x/icons/svg?seed=Relationship.png" class="w-6 h-6 rounded-full">
                    <span class="font-medium text-sm">q/Relationship</span>
                </a>
                  <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-100 rounded-xl">
                    <img src="https://api.dicebear.com/9.x/icons/svg?seed=Thoughts.png" class="w-6 h-6 rounded-full">
                    <span class="font-medium text-sm">q/Thoughts</span>
                </a>
            </div>
            </div>
         </aside>

        <!-- MAIN FEED (AB2FRESH'S PART) -->
        <main class="flex-1 max-w 2xl">
            <!-- Paste both Create Post + Post Cards here -->
        </main>

        <!-- RIGHT SIDEBAR (AB2FRESH'S PART) -->
         <aside class="w-80 hidden xl:block">
            <!-- Build this -->
         </aside>
     </div>

     <!-- FOOTER (MY PART) -->
    <footer class="bg-white border-t mt-12 py-8">

    </footer>

    <script src="js/script.js"></script>
    
</body>
</html>
